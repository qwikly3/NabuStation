# Station 1 ALSA: speakers and microphones.
#
# Speakers: card snddaudio1 (two TAS5751M amplifiers: subwoofer and tweeters,
# 48 kHz, 32-bit, 2 channels).  The default goes through dmix so Snapcast music
# and TTS can play at the same time.  Volume: amixer -c snddaudio1.
#
# Microphones: card snddaudio0, 5 TDM slots of 32 bits at 16 kHz
# (arecord -D hw:snddaudio0,0 -c 5 -f S32_LE -r 16000).
pcm.station_speakers {
	type dmix
	ipc_key 5751
	ipc_perm 0666
	slave {
		pcm "hw:snddaudio1,0"
		rate 48000
		format S32_LE
		channels 2
		period_size 1024
		buffer_size 4096
	}
}
pcm.!default {
	type plug
	slave.pcm "station_speakers"
}
ctl.!default {
	type hw
	card snddaudio1
}
