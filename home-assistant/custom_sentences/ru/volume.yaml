language: "ru"
lists:
  level:
    range:
      from: 0
      to: 100
      type: number
      words_language: ru
intents:
  NabuSetVolume:
    data:
      - sentences:
          - "громкость {level} [процентов]"
          - "громкость на {level} [процентов]"
          - "поставь громкость {level} [процентов]"
          - "поставь громкость на {level} [процентов]"
          - "измени громкость на {level} [процентов]"
          - "измени громкость до {level} [процентов]"
          - "установи громкость {level} [процентов]"
          - "установи громкость на {level} [процентов]"
          - "сделай громкость {level} [процентов]"

  NabuVolumeAsk:
    data:
      - sentences:
          - "измени громкость"
          - "поставь громкость"
          - "установи громкость"
          - "сделай громкость"

  NabuVolumeUp:
    data:
      - sentences:
          - "громче"
          - "погромче"
          - "сделай громче"
          - "сделай погромче"
          - "прибавь громкость"
          - "увеличь громкость"
          - "подними громкость"

  NabuVolumeDown:
    data:
      - sentences:
          - "тише"
          - "потише"
          - "сделай тише"
          - "сделай потише"
          - "убавь громкость"
          - "уменьши громкость"
          - "снизь громкость"

  NabuBluetoothOn:
    data:
      - sentences:
          - "включи блютуз"
          - "включи блютус"
          - "включи bluetooth"
          - "режим блютуз"
          - "режим bluetooth"
          - "стань блютуз колонкой"
          - "подключи телефон по блютузу"
          - "включи режим колонки"

  NabuBluetoothOff:
    data:
      - sentences:
          - "выключи блютуз"
          - "выключи блютус"
          - "выключи bluetooth"
          - "выйди из блютуза"
          - "верни ассистента"
          - "выключи режим колонки"
