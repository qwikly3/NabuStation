# NabuStation: helpers shared by the voice packages.
# Edit these in HA: Settings -> Devices & services -> Helpers.
input_text:
  nabustation_media_player:
    name: NabuStation media player entity
    max: 255
    initial: media_player.station_1
  nabustation_station_host:
    name: NabuStation station IP/host
    max: 255
    initial: 192.168.1.10
  nabustation_voice_host:
    name: NabuStation voice server IP/host
    max: 255
    initial: 127.0.0.1
  nabustation_weather_entity:
    name: NabuStation weather entity
    max: 255
    initial: weather.home
  nabustation_liked_playlist:
    name: NabuStation Liked Songs URI
    max: 255
    initial: ""
  nabustation_last_result:
    name: NabuStation last voice action result
    max: 255
    initial: ""
  nabustation_sleep_status:
    name: NabuStation sleep timer status
    max: 255
    initial: "Таймер сна выключен."
  nabustation_timers_status:
    name: NabuStation active timers
    max: 255
    initial: "Таймеров нет."
  nabustation_alarms_status:
    name: NabuStation alarms
    max: 255
    initial: "Будильников нет."
  nabustation_alarm_reply:
    name: NabuStation last alarm reply
    max: 255
    initial: "Будильник не задан."
  nabustation_next_alarm:
    name: NabuStation next alarm
    max: 255
    initial: "Будильников нет."
  nabustation_night_status:
    name: NabuStation night mode status
    max: 255
    initial: "Ночной режим выключен."
